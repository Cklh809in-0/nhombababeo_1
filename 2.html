<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Solar Tracker | Project Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .tech-gradient {
            background: linear-gradient(135deg, #06b6d4 0%, #10b981 100%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .video-glow {
            box-shadow: 0 0 50px rgba(16, 185, 129, 0.1);
        }
        .btn-back {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(-5px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <div class="fixed inset-0 -z-10">
        <div class="absolute top-0 left-0 h-[500px] w-[500px] bg-cyan-500/5 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-0 right-0 h-[500px] w-[500px] bg-emerald-500/5 blur-[120px] rounded-full"></div>
    </div>

    <div class="w-full max-w-5xl flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
        <a href="index.html" class="btn-back flex items-center gap-3 px-5 py-2.5 rounded-full border border-white/10 text-sm font-bold uppercase tracking-wider text-slate-400 hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Về trang chủ
        </a>
        <div class="text-center md:text-right">
            <h1 class="text-3xl md:text-4xl font-black text-white">DEMO <span class="text-gradient tech-gradient bg-clip-text text-transparent italic">VẬN HÀNH</span></h1>
            <p class="text-emerald-400/60 text-xs font-bold tracking-[0.2em] uppercase mt-1">Hệ thống Solar Tracker v1.0</p>
        </div>
    </div>

    <div class="w-full max-w-5xl">
        <div class="glass-panel p-2 rounded-[2.5rem] video-glow">
            <div class="relative overflow-hidden rounded-[2rem] bg-black aspect-video group">
                <video id="demoVideo" class="w-full h-full object-contain" controls autoplay>
                    <source src="pWF2AmF0GwAAAZ2UYor4YWYAYXUOYXMaAZw0Vg.mp4" type="video/mp4">
                    Trình duyệt của bạn không hỗ trợ video local.
                </video>
                
                <div class="absolute inset-0 pointer-events-none border-[1px] border-white/5 rounded-[2rem]"></div>
            </div>
        </div>

        <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="glass-panel p-5 rounded-3xl flex items-center gap-4">
                <div class="h-10 w-10 tech-gradient rounded-xl flex items-center justify-center text-black font-bold">01</div>
                <div>
                    <h4 class="text-white font-bold text-sm">Cảm biến LDR</h4>
                    <p class="text-slate-500 text-xs">Xử lý ánh sáng 360°</p>
                </div>
            </div>
            <div class="glass-panel p-5 rounded-3xl flex items-center gap-4">
                <div class="h-10 w-10 tech-gradient rounded-xl flex items-center justify-center text-black font-bold">02</div>
                <div>
                    <h4 class="text-white font-bold text-sm">Dual Servo</h4>
                    <p class="text-slate-500 text-xs">Chuyển động mượt mà</p>
                </div>
            </div>
            <div class="glass-panel p-5 rounded-3xl flex items-center gap-4">
                <div class="h-10 w-10 tech-gradient rounded-xl flex items-center justify-center text-black font-bold">03</div>
                <div>
                    <h4 class="text-white font-bold text-sm">Arduino Uno</h4>
                    <p class="text-slate-500 text-xs">Thuật toán tối ưu</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-auto py-10 text-center">
        <p class="text-[10px] font-bold tracking-[0.4em] text-white/20 uppercase">
            © 2026 ABTC Eco-Tech Solution
        </p>
    </footer>

</body>
</html>
